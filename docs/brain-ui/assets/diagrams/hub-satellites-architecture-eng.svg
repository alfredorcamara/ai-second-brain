<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>

    <!-- Hub Glow Gradient -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <!-- Node Glow Gradients -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <!-- Connection Line Gradients -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="lineGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="lineGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <style>
      .orbit-ring {
        animation: spin 30s linear infinite;
        transform-origin: 460px 270px;
      }
      .orbit-ring-rev {
        animation: spinRev 45s linear infinite;
        transform-origin: 460px 270px;
      }
      .data-pulse-1 {
        stroke-dasharray: 8, 16;
        animation: flowDash 2.5s linear infinite;
      }
      .data-pulse-2 {
        stroke-dasharray: 8, 16;
        animation: flowDash 3s linear infinite;
      }
      .hub-aura {
        animation: auraBreathe 4s ease-in-out infinite;
        transform-origin: 460px 270px;
      }
      .hub-card-border {
        animation: borderBreathe 4s ease-in-out infinite;
      }
      .beacon-dot-1 { animation: beaconGlow 2.5s ease-in-out infinite; }
      .beacon-dot-2 { animation: beaconGlow 2.5s ease-in-out infinite 0.6s; }
      .beacon-dot-3 { animation: beaconGlow 2.5s ease-in-out infinite 1.2s; }
      .beacon-dot-4 { animation: beaconGlow 2.5s ease-in-out infinite 1.8s; }
      .flow-particle {
        animation: particlePulse 2.5s ease-in-out infinite;
      }

      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes flowDash { to { stroke-dashoffset: -48; } }
      @keyframes auraBreathe {
        0%, 100% { transform: scale(0.92); opacity: 0.35; }
        50% { transform: scale(1.18); opacity: 0.85; }
      }
      @keyframes borderBreathe {
        0%, 100% { stroke-opacity: 0.45; }
        50% { stroke-opacity: 1; }
      }
      @keyframes beaconGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes particlePulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>
  <rect width="100%" height="100%" fill="url(#gridPattern)" rx="16"/>

  <!-- Orbital Rings Background -->
  <circle cx="460" cy="270" r="210" fill="none" stroke="rgba(99, 102, 241, 0.12)" stroke-width="1.5" stroke-dasharray="4, 8" class="orbit-ring"/>
  <circle cx="460" cy="270" r="280" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" stroke-dasharray="6, 12" class="orbit-ring-rev"/>

  <!-- Connection Paths (Hub to Satellites) -->
  <!-- Top Left: Backend Sat -->
  <path d="M 460 270 Q 320 180 210 110" fill="none" stroke="url(#lineGrad1)" stroke-width="2.5" opacity="0.75" class="data-pulse-1"/>
  <!-- Top Right: Mobile Sat -->
  <path d="M 460 270 Q 600 180 710 110" fill="none" stroke="url(#lineGrad2)" stroke-width="2.5" opacity="0.75" class="data-pulse-2"/>
  <!-- Bottom Left: Web SaaS Sat -->
  <path d="M 460 270 Q 320 360 210 430" fill="none" stroke="url(#lineGrad3)" stroke-width="2.5" opacity="0.75" class="data-pulse-2"/>
  <!-- Bottom Right: Game / AI App Sat -->
  <path d="M 460 270 Q 600 360 710 430" fill="none" stroke="url(#lineGrad4)" stroke-width="2.5" opacity="0.75" class="data-pulse-1"/>

  <!-- Flow Direction Indicators (Glow Particles) -->
  <circle cx="345" cy="200" r="3.5" fill="#38bdf8" filter="url(#glowPulse)" class="flow-particle"/>
  <circle cx="575" cy="200" r="3.5" fill="#34d399" filter="url(#glowPulse)" class="flow-particle"/>
  <circle cx="345" cy="340" r="3.5" fill="#f472b6" filter="url(#glowPulse)" class="flow-particle"/>
  <circle cx="575" cy="340" r="3.5" fill="#fbbf24" filter="url(#glowPulse)" class="flow-particle"/>

  <!-- SATELLITE 1: Backend / API (Top Left) -->
  <g transform="translate(60, 45)">
    <rect width="250" height="90" rx="14" fill="#0d1326" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="35" cy="45" r="22" fill="#0369a1" fill-opacity="0.3"/>
    <text x="35" y="52" font-size="22" text-anchor="middle" fill="#38bdf8">⚙️</text>
    <text x="70" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Satellite Repository</text>
    <text x="70" y="56" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">API Node / Nest / Go / .NET</text>
    <text x="70" y="72" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Physical code, CI/CD &amp; Docker</text>
    <circle cx="235" cy="20" r="4" fill="#38bdf8" class="beacon-dot-1"/>
  </g>

  <!-- SATELLITE 2: Mobile App (Top Right) -->
  <g transform="translate(610, 45)">
    <rect width="250" height="90" rx="14" fill="#0d1a1b" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="35" cy="45" r="22" fill="#047857" fill-opacity="0.3"/>
    <text x="35" y="52" font-size="22" text-anchor="middle" fill="#34d399">📱</text>
    <text x="70" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Satellite Repository</text>
    <text x="70" y="56" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#34d399">App Flutter / React Native</text>
    <text x="70" y="72" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Screens, stores &amp; mobile builds</text>
    <circle cx="235" cy="20" r="4" fill="#34d399" class="beacon-dot-2"/>
  </g>

  <!-- SATELLITE 3: Web SaaS (Bottom Left) -->
  <g transform="translate(60, 400)">
    <rect width="250" height="90" rx="14" fill="#170f1e" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="35" cy="45" r="22" fill="#be185d" fill-opacity="0.3"/>
    <text x="35" y="52" font-size="22" text-anchor="middle" fill="#f472b6">🌐</text>
    <text x="70" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Satellite Repository</text>
    <text x="70" y="56" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f472b6">Web SaaS (Next.js / Vue / Vite)</text>
    <text x="70" y="72" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">UI/UX, landing page &amp; routes</text>
    <circle cx="235" cy="20" r="4" fill="#f472b6" class="beacon-dot-3"/>
  </g>

  <!-- SATELLITE 4: Game / AI Engine (Bottom Right) -->
  <g transform="translate(610, 400)">
    <rect width="250" height="90" rx="14" fill="#1a140d" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="35" cy="45" r="22" fill="#b45309" fill-opacity="0.3"/>
    <text x="35" y="52" font-size="22" text-anchor="middle" fill="#fbbf24">🎮</text>
    <text x="70" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Satellite Repository</text>
    <text x="70" y="56" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fbbf24">Game Unity / Godot / Python</text>
    <text x="70" y="72" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Scripts, shaders &amp; local logic</text>
    <circle cx="235" cy="20" r="4" fill="#fbbf24" class="beacon-dot-4"/>
  </g>

  <!-- CENTRAL HUB: AI SECOND BRAIN -->
  <circle cx="460" cy="270" r="145" fill="url(#hubGlow)" class="hub-aura"/>
  
  <g>
    <rect x="330" y="165" width="260" height="210" rx="22" fill="#101429" stroke="url(#lineGrad1)" stroke-width="2.5" filter="url(#cardShadow)" class="hub-card-border"/>
    
    <!-- Hub Header Badge -->
    <rect x="350" y="180" width="220" height="28" rx="14" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(129, 140, 248, 0.4)"/>
    <text x="460" y="198" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#c7d2fe" letter-spacing="1">🧠 CENTRAL GOVERNANCE HUB</text>
    
    <!-- Hub Title -->
    <text x="460" y="232" font-family="system-ui, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">AI SECOND BRAIN</text>
    <text x="460" y="248" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#a5b4fc">ALFREDO AI OS</text>
    
    <!-- Governance Pillars Inside Hub -->
    <g transform="translate(345, 260)">
      <!-- Pill 1: Rules and Skills -->
      <rect x="0" y="0" width="110" height="38" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="12" y="18" font-size="13">📏</text>
      <text x="32" y="16" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#e2e8f0">.agents/rules</text>
      <text x="32" y="29" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Absolute Standards</text>

      <!-- Pill 2: Memory -->
      <rect x="120" y="0" width="110" height="38" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="132" y="18" font-size="13">🧮</text>
      <text x="152" y="16" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#e2e8f0">memory/</text>
      <text x="152" y="29" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Zero Amnesia</text>

      <!-- Pill 3: Knowledge -->
      <rect x="0" y="46" width="110" height="38" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="12" y="64" font-size="13">📚</text>
      <text x="32" y="62" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#e2e8f0">knowledge/</text>
      <text x="32" y="75" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">AIJev &amp; Patterns</text>

      <!-- Pill 4: Research Lab -->
      <rect x="120" y="46" width="110" height="38" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="132" y="64" font-size="13">🔬</text>
      <text x="152" y="62" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#e2e8f0">Research Lab</text>
      <text x="152" y="75" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Autonomous Synthesis</text>
    </g>

    <!-- Bottom Indicator -->
    <text x="460" y="365" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#38bdf8">
      ⚡ Physiological Link via NTFS Junctions &amp; Symlinks
    </text>
  </g>
</svg>

