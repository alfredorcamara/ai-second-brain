<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <style>
      .cycle-orbit {
        stroke-dasharray: 8, 14;
        animation: spinCycle 24s linear infinite;
        transform-origin: 460px 250px;
      }
      .cycle-pulse-1 {
        stroke-dasharray: 6, 12;
        animation: flowDash 2.5s linear infinite;
      }
      @keyframes spinCycle {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -36; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>
  <rect width="100%" height="100%" fill="url(#gridPattern)" rx="16"/>

  <!-- Center Glow -->
  <circle cx="460" cy="250" r="160" fill="url(#centerGlow)"/>

  <!-- Continuous Loop Ring -->
  <circle cx="460" cy="250" r="170" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="2" class="cycle-orbit"/>

  <!-- Curved Connecting Arcs -->
  <!-- Top to Right -->
  <path d="M 460 80 Q 630 80 630 250" fill="none" stroke="#38bdf8" stroke-width="2.5" class="cycle-pulse-1"/>
  <!-- Right to Bottom -->
  <path d="M 630 250 Q 630 420 460 420" fill="none" stroke="#34d399" stroke-width="2.5" class="cycle-pulse-1"/>
  <!-- Bottom to Left -->
  <path d="M 460 420 Q 290 420 290 250" fill="none" stroke="#fbbf24" stroke-width="2.5" class="cycle-pulse-1"/>
  <!-- Left to Top -->
  <path d="M 290 250 Q 290 80 460 80" fill="none" stroke="#818cf8" stroke-width="2.5" class="cycle-pulse-1"/>

  <!-- Center Hub Text -->
  <g transform="translate(385, 215)">
    <circle cx="75" cy="35" r="45" fill="#131933" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5"/>
    <text x="75" y="30" font-size="24" text-anchor="middle">🧠</text>
    <text x="75" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#a5b4fc" text-anchor="middle">ZERO</text>
    <text x="75" y="60" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#cbd5e1" text-anchor="middle">AMNESIA</text>
  </g>

  <!-- STEP 1: Top (Start Session) -->
  <g transform="translate(345, 25)">
    <rect width="230" height="75" rx="14" fill="#0f162e" stroke="#818cf8" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="30" cy="37" r="16" fill="rgba(129, 140, 248, 0.2)"/>
    <text x="30" y="43" font-size="16" text-anchor="middle">1️⃣</text>
    <text x="56" y="30" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#818cf8">SESSION START</text>
    <text x="56" y="46" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Reads CURRENT_STATE.md</text>
    <text x="56" y="60" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">Loads context &amp; decisions losslessly</text>
  </g>

  <!-- STEP 2: Right (Execution) -->
  <g transform="translate(640, 205)">
    <rect width="240" height="85" rx="14" fill="#091b29" stroke="#38bdf8" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="30" cy="42" r="16" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="30" y="48" font-size="16" text-anchor="middle">2️⃣</text>
    <text x="56" y="32" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#38bdf8">DEVELOPMENT</text>
    <text x="56" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Code, Rules &amp; AI</text>
    <text x="56" y="62" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">Follows .agents/rules &amp; architecture</text>
    <text x="56" y="74" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0284c7">Deterministic ➔ AIJev ➔ LLM</text>
  </g>

  <!-- STEP 3: Bottom (Verification) -->
  <g transform="translate(345, 380)">
    <rect width="230" height="75" rx="14" fill="#0c1f17" stroke="#34d399" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="30" cy="37" r="16" fill="rgba(52, 211, 153, 0.2)"/>
    <text x="30" y="43" font-size="16" text-anchor="middle">3️⃣</text>
    <text x="56" y="30" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#34d399">TESTING &amp; VALIDATION</text>
    <text x="56" y="46" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Quality Verification</text>
    <text x="56" y="60" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">Execution, lint &amp; error checking</text>
  </g>

  <!-- STEP 4: Left (Persistence and Memory) -->
  <g transform="translate(40, 205)">
    <rect width="240" height="85" rx="14" fill="#1e180d" stroke="#fbbf24" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="30" cy="42" r="16" fill="rgba(251, 191, 36, 0.2)"/>
    <text x="30" y="48" font-size="16" text-anchor="middle">4️⃣</text>
    <text x="56" y="32" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#fbbf24">SESSION CLOSE</text>
    <text x="56" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Updates Persistent Memory</text>
    <text x="56" y="62" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">Saves state, decisions &amp; roadmap</text>
    <text x="56" y="74" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#d97706">Next session resumes instantaneously</text>
  </g>
</svg>

