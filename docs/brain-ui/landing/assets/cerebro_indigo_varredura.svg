<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Cérebro neural com varredura de luz</title>
  <desc id="desc">Cérebro em linhas índigo e violeta onde uma faixa de luz varre o ícone da esquerda para a direita, acendendo as linhas e os pontos ao passar, sobre fundo transparente.</desc>
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="30" y1="26" x2="93" y2="91">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset=".55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#9971f7"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="sweep" maskUnits="userSpaceOnUse" x="-20" y="-20" width="168" height="168">
      <rect class="band" x="-40" y="-20" width="40" height="168" fill="url(#band)"/>
    </mask>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.39  0 0 0 0 0.4  0 0 0 0 0.95  0 0 0 1.2 0" result="glowColor"/>
      <feMerge><feMergeNode in="glowColor"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .base { fill:none; stroke:url(#line); stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; opacity:.38; }
      .lit { fill:none; stroke:#c7d2fe; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; filter:url(#glow); }
      .band { animation:sweep 4.5s linear infinite; }
      .node { fill:#818cf8; opacity:.35; transform-box:fill-box; transform-origin:center; animation:flash 4.5s ease-out infinite; }
      @keyframes sweep { 0% { transform:translateX(0) } 80%,100% { transform:translateX(170px) } }
      @keyframes flash {
        0% { opacity:.35; transform:scale(1); fill:#818cf8 }
        4% { opacity:1; transform:scale(2.2); fill:#e0e7ff }
        22%,100% { opacity:.35; transform:scale(1); fill:#818cf8 }
      }
      @media (prefers-reduced-motion: reduce) { .band,.node { animation:none } .node { opacity:.8 } .lit { opacity:.6 } }
    </style>
  </defs>
