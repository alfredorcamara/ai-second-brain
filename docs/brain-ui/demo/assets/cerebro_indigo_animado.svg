<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Cérebro neural índigo animado</title>
  <desc id="desc">Ícone de cérebro em linhas índigo e violeta, com pulsos de energia percorrendo as linhas e ondas concêntricas nos pontos, sobre fundo transparente.</desc>
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="30" y1="26" x2="93" y2="91">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset=".55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#9971f7"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.39  0 0 0 0 0.4  0 0 0 0 0.95  0 0 0 1 0" result="glowColor"/>
      <feMerge><feMergeNode in="glowColor"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .base { fill:none; stroke:url(#line); stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; opacity:.45; }
      .flow { fill:none; stroke:#c7d2fe; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round;
               stroke-dasharray:.16 .84; stroke-dashoffset:1; filter:url(#glow);
               animation:flow 2.6s linear infinite; }
      .flow.main { animation-duration:4.2s; stroke:#a5b4fc; }
      .node { fill:#818cf8; filter:url(#glow); animation:blink 3.2s ease-in-out infinite; }
      .ring { fill:none; stroke:#6366f1; stroke-width:.5; opacity:0;
               transform-box:fill-box; transform-origin:center; animation:ripple 3.2s ease-out infinite; }
      .ring.r2 { stroke:#9971f7; }
      .breath { transform-box:fill-box; transform-origin:center; animation:breath 4.8s ease-in-out infinite; }
      @keyframes flow { from { stroke-dashoffset:1 } to { stroke-dashoffset:0 } }
      @keyframes ripple { 0% { transform:scale(1); opacity:.9 } 70%,100% { transform:scale(5.5); opacity:0 } }
      @keyframes blink { 0%,100% { opacity:.5 } 8% { opacity:1 } 40% { opacity:.6 } }
      @keyframes breath { 0%,100% { transform:scale(1) } 50% { transform:scale(1.02) } }
      @media (prefers-reduced-motion: reduce) { .flow,.node,.ring,.breath { animation:none } .flow { stroke-dashoffset:0; stroke-dasharray:none; opacity:.5 } .ring { opacity:0 } }
    </style>
  </defs>
